apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: circulation-mundia-service
  namespace: mundia-prod
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: circulation-runtime
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: mundia/prod/circulation/postgres
        property: jdbc_url
