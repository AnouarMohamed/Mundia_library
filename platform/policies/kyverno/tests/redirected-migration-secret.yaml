apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: circulation-mundia-service-migration
  namespace: mundia-prod-migrations
spec:
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: attacker-selected-target
  data:
    - secretKey: DATABASE_MIGRATION_URL
      remoteRef:
        key: mundia/prod/circulation/postgres
        property: jdbc_url
