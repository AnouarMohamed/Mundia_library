apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: mundia-restrict-external-secrets
  annotations:
    policies.kyverno.io/title: Restrict External Secret Sources
    policies.kyverno.io/category: Secrets Security
    policies.kyverno.io/severity: critical
spec:
  admission: true
  background: true
  validationFailureAction: Enforce
  rules:
    - name: require-platform-owned-namespace-store
      match:
        any:
          - resources:
              kinds:
                - ExternalSecret
              namespaceSelector:
                matchExpressions:
                  - key: mundiapolis.io/environment
                    operator: In
                    values: [dev, staging, prod]
      validate:
        message: ExternalSecrets must use the platform-owned namespace SecretStore.
        pattern:
          spec:
            secretStoreRef:
              name: aws-secrets-manager
              kind: SecretStore
            X(dataFrom): "null"
    - name: deny-unregistered-external-secret-names
      match:
        any:
          - resources:
              kinds:
                - ExternalSecret
              namespaceSelector:
                matchExpressions:
                  - key: mundiapolis.io/environment
                    operator: In
                    values: [dev, staging, prod]
      validate:
        message: ExternalSecret names are a platform-reviewed interface.
        deny:
          conditions:
            all:
              - key: "{{ request.object.metadata.name }}"
                operator: NotEquals
                value: circulation-mundia-service
              - key: "{{ request.object.metadata.name }}"
                operator: NotEquals
                value: circulation-mundia-service-migration
              - key: "{{ request.object.metadata.name }}"
                operator: NotEquals
                value: otel-exporter
    - name: restrict-dev-runtime-secret-keys
      match:
        any:
          - resources:
              kinds: [ExternalSecret]
              namespaces: [mundia-dev]
              names: [circulation-mundia-service]
      validate:
        message: The development runtime may reference only its approved secret objects.
        foreach:
          - list: request.object.spec.data
            deny:
              conditions:
                all:
                  - key: "{{ element.remoteRef.key }}"
                    operator: NotEquals
                    value: mundia/dev/circulation/postgres
                  - key: "{{ element.remoteRef.key }}"
                    operator: NotEquals
                    value: mundia/dev/circulation/oidc
                  - key: "{{ element.remoteRef.key }}"
                    operator: NotEquals
                    value: mundia/dev/circulation/kafka
                  - key: "{{ element.remoteRef.key }}"
                    operator: NotEquals
                    value: mundia/dev/circulation/redis
    - name: restrict-staging-runtime-secret-keys
      match:
        any:
          - resources:
              kinds: [ExternalSecret]
              namespaces: [mundia-staging]
              names: [circulation-mundia-service]
      validate:
        message: The staging runtime may reference only its approved secret objects.
        foreach:
          - list: request.object.spec.data
            deny:
              conditions:
                all:
                  - key: "{{ element.remoteRef.key }}"
                    operator: NotEquals
                    value: mundia/staging/circulation/postgres
                  - key: "{{ element.remoteRef.key }}"
                    operator: NotEquals
                    value: mundia/staging/circulation/oidc
                  - key: "{{ element.remoteRef.key }}"
                    operator: NotEquals
                    value: mundia/staging/circulation/kafka
                  - key: "{{ element.remoteRef.key }}"
                    operator: NotEquals
                    value: mundia/staging/circulation/redis
    - name: restrict-prod-runtime-secret-keys
      match:
        any:
          - resources:
              kinds: [ExternalSecret]
              namespaces: [mundia-prod]
              names: [circulation-mundia-service]
      validate:
        message: The production runtime may reference only its approved secret objects.
        foreach:
          - list: request.object.spec.data
            deny:
              conditions:
                all:
                  - key: "{{ element.remoteRef.key }}"
                    operator: NotEquals
                    value: mundia/prod/circulation/postgres
                  - key: "{{ element.remoteRef.key }}"
                    operator: NotEquals
                    value: mundia/prod/circulation/oidc
                  - key: "{{ element.remoteRef.key }}"
                    operator: NotEquals
                    value: mundia/prod/circulation/kafka
                  - key: "{{ element.remoteRef.key }}"
                    operator: NotEquals
                    value: mundia/prod/circulation/redis
    - name: restrict-migration-and-platform-secret-keys
      match:
        any:
          - resources:
              kinds: [ExternalSecret]
              namespaceSelector:
                matchExpressions:
                  - key: mundiapolis.io/environment
                    operator: In
                    values: [dev, staging, prod]
      validate:
        message: Migration and telemetry ExternalSecrets must use their exact environment key.
        foreach:
          - list: request.object.spec.data
            preconditions:
              any:
                - key: "{{ request.object.metadata.name }}"
                  operator: Equals
                  value: circulation-mundia-service-migration
                - key: "{{ request.object.metadata.name }}"
                  operator: Equals
                  value: otel-exporter
            deny:
              conditions:
                all:
                  - key: "{{ request.object.metadata.namespace }}/{{ request.object.metadata.name }}/{{ element.remoteRef.key }}"
                    operator: NotEquals
                    value: mundia-dev-migrations/circulation-mundia-service-migration/mundia/dev/circulation/postgres-migration
                  - key: "{{ request.object.metadata.namespace }}/{{ request.object.metadata.name }}/{{ element.remoteRef.key }}"
                    operator: NotEquals
                    value: mundia-staging-migrations/circulation-mundia-service-migration/mundia/staging/circulation/postgres-migration
                  - key: "{{ request.object.metadata.namespace }}/{{ request.object.metadata.name }}/{{ element.remoteRef.key }}"
                    operator: NotEquals
                    value: mundia-prod-migrations/circulation-mundia-service-migration/mundia/prod/circulation/postgres-migration
                  - key: "{{ request.object.metadata.namespace }}/{{ request.object.metadata.name }}/{{ element.remoteRef.key }}"
                    operator: NotEquals
                    value: mundia-dev/otel-exporter/mundia/dev/platform/otel
                  - key: "{{ request.object.metadata.namespace }}/{{ request.object.metadata.name }}/{{ element.remoteRef.key }}"
                    operator: NotEquals
                    value: mundia-staging/otel-exporter/mundia/staging/platform/otel
                  - key: "{{ request.object.metadata.namespace }}/{{ request.object.metadata.name }}/{{ element.remoteRef.key }}"
                    operator: NotEquals
                    value: mundia-prod/otel-exporter/mundia/prod/platform/otel
    - name: require-exact-secret-targets
      match:
        any:
          - resources:
              kinds: [ExternalSecret]
              namespaceSelector:
                matchExpressions:
                  - key: mundiapolis.io/environment
                    operator: In
                    values: [dev, staging, prod]
      validate:
        message: ExternalSecret targets are fixed and may not be redirected.
        deny:
          conditions:
            all:
              - key: "{{ request.object.metadata.namespace }}/{{ request.object.metadata.name }}/{{ request.object.spec.target.name }}"
                operator: NotEquals
                value: mundia-dev/circulation-mundia-service/circulation-runtime
              - key: "{{ request.object.metadata.namespace }}/{{ request.object.metadata.name }}/{{ request.object.spec.target.name }}"
                operator: NotEquals
                value: mundia-staging/circulation-mundia-service/circulation-runtime
              - key: "{{ request.object.metadata.namespace }}/{{ request.object.metadata.name }}/{{ request.object.spec.target.name }}"
                operator: NotEquals
                value: mundia-prod/circulation-mundia-service/circulation-runtime
              - key: "{{ request.object.metadata.namespace }}/{{ request.object.metadata.name }}/{{ request.object.spec.target.name }}"
                operator: NotEquals
                value: mundia-dev-migrations/circulation-mundia-service-migration/circulation-migration
              - key: "{{ request.object.metadata.namespace }}/{{ request.object.metadata.name }}/{{ request.object.spec.target.name }}"
                operator: NotEquals
                value: mundia-staging-migrations/circulation-mundia-service-migration/circulation-migration
              - key: "{{ request.object.metadata.namespace }}/{{ request.object.metadata.name }}/{{ request.object.spec.target.name }}"
                operator: NotEquals
                value: mundia-prod-migrations/circulation-mundia-service-migration/circulation-migration
              - key: "{{ request.object.metadata.namespace }}/{{ request.object.metadata.name }}/{{ request.object.spec.target.name }}"
                operator: NotEquals
                value: mundia-dev/otel-exporter/otel-exporter-auth
              - key: "{{ request.object.metadata.namespace }}/{{ request.object.metadata.name }}/{{ request.object.spec.target.name }}"
                operator: NotEquals
                value: mundia-staging/otel-exporter/otel-exporter-auth
              - key: "{{ request.object.metadata.namespace }}/{{ request.object.metadata.name }}/{{ request.object.spec.target.name }}"
                operator: NotEquals
                value: mundia-prod/otel-exporter/otel-exporter-auth
