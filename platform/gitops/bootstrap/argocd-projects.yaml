apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mundia-workloads
  namespace: argocd
spec:
  description: Mundiapolis environment workloads
  sourceRepos:
    - REPLACE_GIT_REPOSITORY_URL
  destinations:
    - namespace: mundia-dev
      server: https://kubernetes.default.svc
    - namespace: mundia-staging
      server: https://kubernetes.default.svc
    - namespace: mundia-prod
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: external-secrets.io
      kind: ClusterSecretStore
  namespaceResourceBlacklist:
    - group: ""
      kind: Secret
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-addons
  namespace: argocd
spec:
  description: Reviewed cluster add-ons and admission policy
  sourceRepos:
    - REPLACE_GIT_REPOSITORY_URL
    - https://charts.external-secrets.io
    - https://kubernetes.github.io/ingress-nginx
    - https://charts.jetstack.io
    - https://kyverno.github.io/kyverno
    - https://kubernetes-sigs.github.io/metrics-server
    - https://prometheus-community.github.io/helm-charts
  destinations:
    - namespace: external-secrets
      server: https://kubernetes.default.svc
    - namespace: ingress-nginx
      server: https://kubernetes.default.svc
    - namespace: cert-manager
      server: https://kubernetes.default.svc
    - namespace: kyverno
      server: https://kubernetes.default.svc
    - namespace: monitoring
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"

