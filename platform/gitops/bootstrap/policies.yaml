apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mundia-admission-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: platform-addons
  source:
    repoURL: REPLACE_GIT_REPOSITORY_URL
    targetRevision: REPLACE_REVIEWED_GIT_COMMIT_SHA
    path: platform/policies/kyverno
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true

