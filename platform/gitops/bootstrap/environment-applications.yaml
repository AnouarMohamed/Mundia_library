apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mundia-dev-platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform-addons
  source:
    repoURL: REPLACE_GIT_REPOSITORY_URL
    targetRevision: REPLACE_REVIEWED_GIT_COMMIT_SHA
    path: platform/gitops/platform/environments/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: mundia-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
