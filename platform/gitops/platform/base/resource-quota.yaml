apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-capacity
spec:
  hard:
    requests.cpu: "24"
    requests.memory: 48Gi
    limits.cpu: "48"
    limits.memory: 96Gi
    count/deployments.apps: "40"
    count/statefulsets.apps: "0"
    count/jobs.batch: "20"
    count/services: "60"
    services.loadbalancers: "0"
    services.nodeports: "0"

