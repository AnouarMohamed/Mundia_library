apiVersion: v1
kind: LimitRange
metadata:
  name: workload-defaults
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      default:
        cpu: "1"
        memory: 1Gi
      max:
        cpu: "4"
        memory: 8Gi
      min:
        cpu: 25m
        memory: 64Mi

