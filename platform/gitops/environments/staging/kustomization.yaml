apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mundia-staging

helmGlobals:
  chartHome: ../../../helm
helmCharts:
  - name: mundia-service
    releaseName: circulation
    namespace: mundia-staging
    valuesFile: values-circulation.yaml
    includeCRDs: false
  - name: mundia-service
    releaseName: web-bff
    namespace: mundia-staging
    valuesFile: values-web-bff.yaml
    includeCRDs: false
