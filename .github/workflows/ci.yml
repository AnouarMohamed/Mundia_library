name: CI

on:
  push:
    branches:
      - main
      - develop
      - "release/**"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "screenshots/**"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches:
      - "**"
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "screenshots/**"
      - ".github/ISSUE_TEMPLATE/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: Platform Contract
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Create isolated validation environment
        run: |
          python3 -m venv /tmp/mundia-platform-validation
          /tmp/mundia-platform-validation/bin/pip install \
            --disable-pip-version-check \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            -r platform/requirements-validation-ci-py312-linux-x86_64.txt
          /tmp/mundia-platform-validation/bin/python -c \
            'import yaml; print(f"PyYAML {yaml.__version__} ready")'

      - name: Verify required render tools
        run: |
          command -v helm
          command -v kubectl
          helm version --short
          kubectl version --client

      - name: Validate platform contract
        env:
          PATH: /tmp/mundia-platform-validation/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          PLATFORM_VALIDATION_PYTHON: /tmp/mundia-platform-validation/bin/python
        run: platform/scripts/validate.sh

  quality:
    name: Quality (Lint, Typecheck, Test, E2E, Build)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
        env:
          POSTGRES_USER: library
          POSTGRES_PASSWORD: library
          POSTGRES_DB: library
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U library -d library"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm run deps:build-native

      - name: Complete dependency audit
        run: npm run security:audit

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Prepare E2E database
        env:
          DATABASE_URL: postgresql://library:library@127.0.0.1:5432/library
          ALLOW_TEST_FIXTURES: "true"
        run: |
          npm run db:migrate
          npm run seed

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: Playwright E2E
        env:
          DATABASE_URL: postgresql://library:library@127.0.0.1:5432/library
          NEXTAUTH_SECRET: ci-e2e-secret-ci-e2e-secret
          AUTH_SECRET: ci-e2e-secret-ci-e2e-secret
          NEXTAUTH_URL: http://127.0.0.1:3100
          NEXT_PUBLIC_API_ENDPOINT: http://127.0.0.1:3100
          NEXT_PUBLIC_PROD_API_ENDPOINT: http://127.0.0.1:3100
          NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT: https://example.com
          IMAGEKIT_PRIVATE_KEY: ci-build-private-key
          ENABLE_WORKFLOWS: "false"
          E2E_USER_EMAIL: test@user.com
          E2E_USER_PASSWORD: "12345678"
          E2E_ADMIN_EMAIL: test@admin.com
          E2E_ADMIN_PASSWORD: "12345678"
          E2E_PENDING_EMAIL: pending-e2e@example.test
          E2E_PENDING_PASSWORD: "12345678"
          E2E_OTHER_USER_ID: 00000000-0000-4000-8000-000000000002
        run: npm run test:e2e

      - name: Build
        env:
          APP_ENV: development
          DATABASE_URL: postgresql://library:library@127.0.0.1:5432/library
          NEXTAUTH_SECRET: ci-build-secret
          AUTH_SECRET: ci-build-secret
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_API_ENDPOINT: http://localhost:3000
          NEXT_PUBLIC_PROD_API_ENDPOINT: http://localhost:3000
          NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT: https://example.com
          IMAGEKIT_PRIVATE_KEY: ci-build-private-key
          UPSTASH_REDIS_URL: https://example.upstash.io
          UPSTASH_REDIS_TOKEN: ci-build-token
          QSTASH_URL: https://qstash.upstash.io
          QSTASH_TOKEN: ci-build-token
          BREVO_API_KEY: ci-build-token
          BREVO_SENDER_EMAIL: noreply@example.com
          RESEND_TOKEN: ci-build-token
          ENABLE_WORKFLOWS: "false"
        run: npm run build

  circulation-migration-tool:
    name: Circulation Migration Tool (PostgreSQL 18)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
        env:
          POSTGRES_USER: library
          POSTGRES_PASSWORD: library
          POSTGRES_DB: circulation_migration_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U library -d circulation_migration_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: tools/circulation-migration

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm run deps:build-native

      - name: Audit complete dependency graph
        run: npm audit --audit-level=low

      - name: Typecheck and isolated tests
        run: npm run check

      - name: Build the reviewed migration runner
        working-directory: services
        run: ./gradlew :circulation-service:bootJar --no-daemon

      - name: Apply circulation Flyway migrations 1 through 12
        working-directory: services
        env:
          APP_MIGRATION_ONLY: "true"
          DATABASE_MIGRATION_URL: jdbc:postgresql://127.0.0.1:5432/circulation_migration_ci
          DATABASE_MIGRATION_USERNAME: library
          DATABASE_MIGRATION_PASSWORD: library
        run: java -jar circulation-service/build/libs/circulation-service.jar

      - name: Rehearse exact migration against fresh PostgreSQL 18
        env:
          CIRCULATION_MIGRATION_REQUIRE_INTEGRATION: "true"
          CIRCULATION_MIGRATION_TEST_URL: postgresql://library:library@127.0.0.1:5432/circulation_migration_ci
          CIRCULATION_MIGRATION_TEST_DATABASE: circulation_migration_ci
        run: npm run test:integration

  migration:
    name: Fresh Database Migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
        env:
          POSTGRES_USER: library
          POSTGRES_PASSWORD: library
          POSTGRES_DB: library
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U library -d library"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://library:library@127.0.0.1:5432/library

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm run deps:build-native

      - name: Apply canonical migrations
        run: npm run db:migrate

      - name: Verify production schema
        run: npm run db:verify-schema

      - name: Verify local fixture seed against migrated schema
        env:
          ALLOW_TEST_FIXTURES: "true"
        run: npm run seed

      - name: Verify circulation concurrency invariants
        run: npm run db:verify-concurrency

      - name: Verify distributed rate-limit concurrency invariants
        run: npm run db:verify-rate-limits

  backend-services:
    name: Backend Services (JDK 25)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Compile, test, and package
        working-directory: services
        run: ./gradlew clean check bootJar --no-daemon

  docker:
    name: Docker Image Build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          pull: true
          push: false
          tags: mundia-library:ci
          build-args: |
            NEXT_PUBLIC_API_ENDPOINT=http://localhost:3000
            NEXT_PUBLIC_PROD_API_ENDPOINT=http://localhost:3000
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build circulation service image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./services
          file: ./services/circulation-service/Dockerfile
          pull: true
          push: false
          tags: mundia-circulation-service:ci
          cache-from: type=gha,scope=circulation
          cache-to: type=gha,mode=max,scope=circulation

      - name: Build membership service image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./services
          file: ./services/membership-service/Dockerfile
          pull: true
          push: false
          tags: mundia-membership-service:ci
          cache-from: type=gha,scope=membership
          cache-to: type=gha,mode=max,scope=membership

      - name: Build catalog service image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./services
          file: ./services/catalog-service/Dockerfile
          pull: true
          push: false
          tags: mundia-catalog-service:ci
          cache-from: type=gha,scope=catalog
          cache-to: type=gha,mode=max,scope=catalog

  publish-containers:
    name: Publish ${{ matrix.name }} to GHCR
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs:
      - platform
      - quality
      - circulation-migration-tool
      - migration
      - backend-services
      - docker
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            image: mundia-library
            context: .
            dockerfile: ./Dockerfile
            cache_scope: publish-web
          - name: circulation
            image: mundia-circulation-service
            context: ./services
            dockerfile: ./services/circulation-service/Dockerfile
            cache_scope: publish-circulation
          - name: membership
            image: mundia-membership-service
            context: ./services
            dockerfile: ./services/membership-service/Dockerfile
            cache_scope: publish-membership
          - name: catalog
            image: mundia-catalog-service
            context: ./services
            dockerfile: ./services/catalog-service/Dockerfile
            cache_scope: publish-catalog

    steps:
      - name: Checkout verified source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Resolve image metadata
        id: metadata
        env:
          CONFIGURED_API_ENDPOINT: ${{ vars.NEXT_PUBLIC_API_ENDPOINT }}
          CONFIGURED_PROD_API_ENDPOINT: ${{ vars.NEXT_PUBLIC_PROD_API_ENDPOINT }}
          CONFIGURED_IMAGEKIT_ENDPOINT: ${{ vars.NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT }}
          IMAGE_NAME: ${{ matrix.image }}
          COMPONENT_NAME: ${{ matrix.name }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repository="ghcr.io/${owner}/${IMAGE_NAME}"
          short_sha="${GITHUB_SHA:0:12}"
          tags="${repository}:sha-${short_sha}"

          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            tags+=$'\n'"${repository}:main"
            version="sha-${short_sha}"
          else
            version="${GITHUB_REF_NAME}"
            tags+=$'\n'"${repository}:${version}"
            if [[ "$version" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              tags+=$'\n'"${repository}:${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
              tags+=$'\n'"${repository}:${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
              tags+=$'\n'"${repository}:${BASH_REMATCH[1]}"
              tags+=$'\n'"${repository}:latest"
            else
              echo "Unsupported release tag: $version" >&2
              exit 1
            fi
          fi

          build_args=""
          if [[ "$COMPONENT_NAME" == "web" ]]; then
            api_endpoint="${CONFIGURED_API_ENDPOINT:-https://mundia-library.vercel.app}"
            prod_api_endpoint="${CONFIGURED_PROD_API_ENDPOINT:-$api_endpoint}"
            imagekit_endpoint="${CONFIGURED_IMAGEKIT_ENDPOINT:-}"
            build_args="NEXT_PUBLIC_API_ENDPOINT=${api_endpoint}"
            build_args+=$'\n'"NEXT_PUBLIC_PROD_API_ENDPOINT=${prod_api_endpoint}"
            build_args+=$'\n'"NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT=${imagekit_endpoint}"
          fi

          {
            echo "repository=${repository}"
            echo "version=${version}"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
            echo "build_args<<EOF"
            echo "$build_args"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build native scan candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          pull: true
          load: true
          tags: local/${{ matrix.image }}:release-scan
          build-args: ${{ steps.metadata.outputs.build_args }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

      - name: Block high and critical image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          image-ref: local/${{ matrix.image }}:release-scan
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Build and publish multi-architecture image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}
            org.opencontainers.image.title=${{ matrix.image }}
          build-args: ${{ steps.metadata.outputs.build_args }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

      - name: Record immutable deployment reference
        env:
          IMAGE_REPOSITORY: ${{ steps.metadata.outputs.repository }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_VERSION: ${{ steps.metadata.outputs.version }}
          COMPONENT_NAME: ${{ matrix.name }}
        run: |
          jq -n \
            --arg component "$COMPONENT_NAME" \
            --arg repository "$IMAGE_REPOSITORY" \
            --arg digest "$IMAGE_DIGEST" \
            --arg version "$IMAGE_VERSION" \
            --arg revision "$GITHUB_SHA" \
            '{component:$component,repository:$repository,digest:$digest,version:$version,revision:$revision}' \
            > "container-${COMPONENT_NAME}.json"

      - name: Upload deployment reference
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: container-reference-${{ matrix.name }}-${{ github.sha }}
          path: container-${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: 90
