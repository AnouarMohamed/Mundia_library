name: Nightly API Load Test

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-load-${{ github.ref }}
  cancel-in-progress: true

jobs:
  load-test:
    name: Nightly load test and trend artifact
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:18@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: library_management
          POSTGRES_PASSWORD: rootpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d library_management"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: staging
      DATABASE_URL: postgresql://postgres:rootpassword@127.0.0.1:5432/library_management
      NEXTAUTH_SECRET: ci-load-secret
      AUTH_SECRET: ci-load-secret
      NEXTAUTH_URL: http://127.0.0.1:3000
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_API_ENDPOINT: http://127.0.0.1:3000
      NEXT_PUBLIC_PROD_API_ENDPOINT: http://127.0.0.1:3000
      NEXT_PUBLIC_IMAGEKIT_URL_ENDPOINT: https://example.com
      IMAGEKIT_PRIVATE_KEY: ci-load-private-key
      UPSTASH_REDIS_URL: http://127.0.0.1:8079
      UPSTASH_REDIS_TOKEN: ci-local-redis-token
      QSTASH_URL: https://qstash.upstash.io
      QSTASH_TOKEN: ci-load-token
      BREVO_API_KEY: ci-load-token
      BREVO_SENDER_EMAIL: noreply@example.com
      RESEND_TOKEN: ci-load-token
      ENABLE_WORKFLOWS: "false"
      ALLOW_TEST_FIXTURES: "true"
      OIDC_ISSUER: https://identity.example.test/tenant
      OIDC_CLIENT_ID: ci-load-client
      OIDC_CLIENT_SECRET: ci-load-client-secret
      OIDC_ALLOWED_EMAIL_DOMAINS: example.test
      ENABLE_LOCAL_CREDENTIALS: "false"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm run deps:build-native

      - name: Apply schema and seed
        run: |
          npm run db:migrate
          npm run seed

      - name: Build app
        run: npm run build

      - name: Start app and run load test
        run: |
          set -euo pipefail

          node scripts/upstash-redis-mock.mjs > /tmp/upstash-redis-mock.log 2>&1 &
          CACHE_PID=$!
          npm run start > /tmp/next-nightly-server.log 2>&1 &
          SERVER_PID=$!

          cleanup() {
            if kill -0 "$SERVER_PID" >/dev/null 2>&1; then
              kill "$SERVER_PID" >/dev/null 2>&1 || true
              wait "$SERVER_PID" 2>/dev/null || true
            fi
            if kill -0 "$CACHE_PID" >/dev/null 2>&1; then
              kill "$CACHE_PID" >/dev/null 2>&1 || true
              wait "$CACHE_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          for i in {1..30}; do
            if curl -sf "http://127.0.0.1:8079/health" >/dev/null; then
              break
            fi
            sleep 1
          done

          if ! curl -sf "http://127.0.0.1:8079/health" >/dev/null; then
            echo "Local Redis test double failed to start"
            cat /tmp/upstash-redis-mock.log
            exit 1
          fi

          for i in {1..60}; do
            if curl -sf "http://127.0.0.1:3000/api/books?limit=1" >/dev/null; then
              echo "API server is ready"
              node scripts/nightly-load-test.mjs
              exit 0
            fi
            sleep 2
          done
          echo "Server failed to start"
          cat /tmp/next-nightly-server.log
          exit 1

      - name: Upload load test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-load-artifacts
          path: |
            artifacts/perf/nightly-load-report.json
            artifacts/perf/nightly-load-report.md
            /tmp/next-nightly-server.log
            /tmp/upstash-redis-mock.log
