server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: none
  max-http-request-header-size: 16KB
  tomcat:
    connection-timeout: 5s
    keep-alive-timeout: 15s
    max-keep-alive-requests: 100
    max-http-form-post-size: 16KB
    max-swallow-size: 16KB
    max-parameter-count: 32

spring:
  application:
    name: digital-content-service
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:55436/digital_content}
    username: ${DATABASE_USERNAME:digital_content}
    password: ${DATABASE_PASSWORD:digital-content-local-only}
    hikari:
      pool-name: digital-content-pool
      maximum-pool-size: ${DATABASE_POOL_MAX_SIZE:10}
      minimum-idle: ${DATABASE_POOL_MIN_IDLE:1}
      connection-timeout: 3000
      validation-timeout: 1000
      max-lifetime: 1500000
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
    clean-disabled: true
    validate-on-migrate: true
  jooq:
    sql-dialect: postgres

app:
  ingestion:
    enabled: ${DIGITAL_CONTENT_INGESTION_ENABLED:false}
    region: ${AWS_REGION:eu-west-1}
    bucket: ${DIGITAL_CONTENT_QUARANTINE_BUCKET:disabled-quarantine-bucket}
    expected-bucket-owner: ${AWS_ACCOUNT_ID:000000000000}
    kms-key-id: ${DIGITAL_CONTENT_QUARANTINE_KMS_KEY_ID:disabled}
    upload-url-lifetime: ${DIGITAL_CONTENT_UPLOAD_URL_LIFETIME:PT5M}
    session-lifetime: ${DIGITAL_CONTENT_INGESTION_SESSION_LIFETIME:PT24H}
    call-timeout: ${DIGITAL_CONTENT_S3_CALL_TIMEOUT:PT10S}
    attempt-timeout: ${DIGITAL_CONTENT_S3_ATTEMPT_TIMEOUT:PT5S}
  malware-scan:
    enabled: ${DIGITAL_CONTENT_SCAN_ENABLED:false}
    queue-url: ${DIGITAL_CONTENT_SCAN_QUEUE_URL:https://sqs.eu-west-1.amazonaws.com/000000000000/disabled}
    wait-time: ${DIGITAL_CONTENT_SCAN_WAIT_TIME:PT10S}
    visibility-timeout: ${DIGITAL_CONTENT_SCAN_VISIBILITY_TIMEOUT:PT2M}
    maximum-message-bytes: ${DIGITAL_CONTENT_SCAN_MAXIMUM_MESSAGE_BYTES:262144}
    maximum-message-age: ${DIGITAL_CONTENT_SCAN_MAXIMUM_MESSAGE_AGE:P14D}
    maximum-future-skew: ${DIGITAL_CONTENT_SCAN_MAXIMUM_FUTURE_SKEW:PT5M}
    maximum-poll-silence: ${DIGITAL_CONTENT_SCAN_MAXIMUM_POLL_SILENCE:PT2M}
    startup-grace-period: ${DIGITAL_CONTENT_SCAN_STARTUP_GRACE_PERIOD:PT1M}
    retry-backoff: ${DIGITAL_CONTENT_SCAN_RETRY_BACKOFF:PT1S}
    maximum-consecutive-failures: ${DIGITAL_CONTENT_SCAN_MAXIMUM_CONSECUTIVE_FAILURES:5}
  download:
    cloudfront:
      enabled: ${DOWNLOAD_SIGNING_ENABLED:false}
      base-url: ${DOWNLOAD_CLOUDFRONT_BASE_URL:}
      key-pair-id: ${DOWNLOAD_CLOUDFRONT_KEY_PAIR_ID:}
      private-key-path: ${DOWNLOAD_CLOUDFRONT_PRIVATE_KEY_PATH:}
      url-lifetime: ${DOWNLOAD_URL_LIFETIME:PT1M}
  security:
    jwt:
      issuer: ${AUTH_ISSUER_URI}
      jwk-set-uri: ${AUTH_JWK_SET_URI}
      audience: ${AUTH_AUDIENCE:digital-content-api}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db,malwareScan
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
