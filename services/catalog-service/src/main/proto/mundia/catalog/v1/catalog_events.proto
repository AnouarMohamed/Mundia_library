syntax = "proto3";

package mundia.catalog.v1;

import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "com.mundiapolis.library.catalog.contract.v1";
option java_outer_classname = "CatalogEventsProto";

// Immutable v1 broker contract. Field numbers are never reused. Consumers
// deduplicate by event_id; transport delivery is at least once.
message CatalogEvent {
  string event_id = 1;
  string event_type = 2;
  uint32 event_version = 3;
  string aggregate_type = 4;
  string aggregate_id = 5;
  uint64 aggregate_version = 6;
  google.protobuf.Timestamp occurred_at = 7;

  oneof payload {
    WorkEvent work = 20;
    EditionEvent edition = 21;
  }

  reserved 8 to 19;
}

message Contributor {
  string contributor_id = 1;
  string name = 2;
  optional string biography = 3;
}

message WorkEvent {
  string work_id = 1;
  string title = 2;
  string summary = 3;
  string description = 4;
  string genre = 5;
  double rating = 6;
  repeated Contributor authors = 7;
}

message EditionEvent {
  string edition_id = 1;
  string work_id = 2;
  string title = 3;
  string isbn = 4;
  string publisher = 5;
  uint32 publication_year = 6;
  string language = 7;
  uint32 page_count = 8;
  optional string cover_url = 9;
  optional string cover_color = 10;
  optional string video_url = 11;
  bool is_active = 12;
}
