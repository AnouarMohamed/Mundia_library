server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: none
  max-http-request-header-size: 16KB
  tomcat:
    connection-timeout: 5s
    keep-alive-timeout: 15s
    max-keep-alive-requests: 100
    max-http-form-post-size: 4KB
    max-swallow-size: 4KB
    max-parameter-count: 16

spring:
  application:
    name: notification-service
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
  lifecycle:
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:55435/notification}
    username: ${DATABASE_USERNAME:notification}
    password: ${DATABASE_PASSWORD:notification-local-only}
    hikari:
      pool-name: notification-pool
      maximum-pool-size: ${DATABASE_POOL_MAX_SIZE:10}
      minimum-idle: ${DATABASE_POOL_MIN_IDLE:1}
      connection-timeout: 3000
      validation-timeout: 1000
      max-lifetime: 1500000
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
    clean-disabled: true
    validate-on-migrate: true
  jooq:
    sql-dialect: postgres

app:
  email-worker:
    enabled: ${NOTIFICATION_EMAIL_WORKER_ENABLED:false}
    instance-id: ${NOTIFICATION_EMAIL_WORKER_INSTANCE_ID:${HOSTNAME:local}}
    poll-interval: ${NOTIFICATION_EMAIL_WORKER_POLL_INTERVAL:PT1S}
    lease-duration: ${NOTIFICATION_EMAIL_WORKER_LEASE_DURATION:PT2M}
    batch-size: ${NOTIFICATION_EMAIL_WORKER_BATCH_SIZE:10}
    maximum-attempts: ${NOTIFICATION_EMAIL_WORKER_MAXIMUM_ATTEMPTS:8}
    retry-base-delay: ${NOTIFICATION_EMAIL_WORKER_RETRY_BASE_DELAY:PT5S}
    retry-maximum-delay: ${NOTIFICATION_EMAIL_WORKER_RETRY_MAXIMUM_DELAY:PT1H}
    operation-timeout: ${NOTIFICATION_EMAIL_WORKER_OPERATION_TIMEOUT:PT10S}
    maximum-pending-age: ${NOTIFICATION_EMAIL_WORKER_MAXIMUM_PENDING_AGE:PT5M}
  intent-consumer:
    enabled: ${NOTIFICATION_INTENT_CONSUMER_ENABLED:false}
    instance-id: ${NOTIFICATION_INTENT_CONSUMER_INSTANCE_ID:${HOSTNAME:local}}
    group-id: ${NOTIFICATION_INTENT_CONSUMER_GROUP_ID:notification-intents-v1}
    topic: ${NOTIFICATION_INTENT_CONSUMER_TOPIC:mundia.notification.intents.v1}
    schema-subject: ${NOTIFICATION_INTENT_CONSUMER_SCHEMA_SUBJECT:mundia.notification.v1.NotificationIntent}
    schema-version: ${NOTIFICATION_INTENT_CONSUMER_SCHEMA_VERSION:1}
    poll-timeout: ${NOTIFICATION_INTENT_CONSUMER_POLL_TIMEOUT:PT0.5S}
    commit-timeout: ${NOTIFICATION_INTENT_CONSUMER_COMMIT_TIMEOUT:PT5S}
    retry-backoff: ${NOTIFICATION_INTENT_CONSUMER_RETRY_BACKOFF:PT0.25S}
    startup-grace-period: ${NOTIFICATION_INTENT_CONSUMER_STARTUP_GRACE:PT30S}
    maximum-poll-silence: ${NOTIFICATION_INTENT_CONSUMER_MAXIMUM_POLL_SILENCE:PT30S}
    maximum-poll-records: ${NOTIFICATION_INTENT_CONSUMER_MAXIMUM_POLL_RECORDS:50}
    maximum-event-bytes: ${NOTIFICATION_INTENT_CONSUMER_MAXIMUM_EVENT_BYTES:262144}
    kafka:
      bootstrap-servers: ${NOTIFICATION_INTENT_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      security-protocol: ${NOTIFICATION_INTENT_KAFKA_SECURITY_PROTOCOL:SASL_SSL}
      allow-insecure-transport: ${NOTIFICATION_INTENT_KAFKA_ALLOW_INSECURE_TRANSPORT:false}
      sasl-mechanism: ${NOTIFICATION_INTENT_KAFKA_SASL_MECHANISM:SCRAM-SHA-512}
      sasl-jaas-config: ${NOTIFICATION_INTENT_KAFKA_SASL_JAAS_CONFIG:}
      truststore-location: ${NOTIFICATION_INTENT_KAFKA_TRUSTSTORE_LOCATION:}
      truststore-password: ${NOTIFICATION_INTENT_KAFKA_TRUSTSTORE_PASSWORD:}
      keystore-location: ${NOTIFICATION_INTENT_KAFKA_KEYSTORE_LOCATION:}
      keystore-password: ${NOTIFICATION_INTENT_KAFKA_KEYSTORE_PASSWORD:}
      key-password: ${NOTIFICATION_INTENT_KAFKA_KEY_PASSWORD:}
      request-timeout: ${NOTIFICATION_INTENT_KAFKA_REQUEST_TIMEOUT:PT10S}
      session-timeout: ${NOTIFICATION_INTENT_KAFKA_SESSION_TIMEOUT:PT30S}
      heartbeat-interval: ${NOTIFICATION_INTENT_KAFKA_HEARTBEAT_INTERVAL:PT3S}
  security:
    jwt:
      issuer: ${AUTH_ISSUER_URI}
      jwk-set-uri: ${AUTH_JWK_SET_URI}
      audience: ${AUTH_AUDIENCE:notification-api}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db,notificationIntentConsumer,emailDelivery
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
