name: mundia-library-services

services:
  circulation-db:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_DB: circulation
      POSTGRES_USER: circulation
      POSTGRES_PASSWORD: circulation-local-only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U circulation -d circulation"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - circulation_db_data:/var/lib/postgresql

  membership-db:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_DB: membership
      POSTGRES_USER: membership
      POSTGRES_PASSWORD: membership-local-only
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U membership -d membership"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - membership_db_data:/var/lib/postgresql

volumes:
  circulation_db_data:
  membership_db_data:
