server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: none
  max-http-request-header-size: 16KB
  servlet:
    session:
      cookie:
        name: MUNDIA_SESSION
        http-only: true
        secure: ${BFF_SECURE_COOKIES:false}
        same-site: lax
        path: /
      timeout: ${BFF_SESSION_MAXIMUM_AGE:PT8H}
  tomcat:
    connection-timeout: 5s
    keep-alive-timeout: 15s
    max-keep-alive-requests: 100
    max-http-form-post-size: 16KB
    max-swallow-size: 16KB
    max-parameter-count: 32

spring:
  application:
    name: web-bff
  lifecycle:
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      enabled: true
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:PT2S}
      timeout: ${REDIS_COMMAND_TIMEOUT:PT2S}
  session:
    timeout: ${BFF_SESSION_MAXIMUM_AGE:PT8H}
    redis:
      namespace: mundia:web-bff:session
      cleanup-cron: "0 * * * * *"
  security:
    oauth2:
      client:
        provider:
          institutional:
            issuer-uri: ${OIDC_ISSUER}
        registration:
          catalog-service:
            provider: institutional
            client-id: ${CATALOG_CLIENT_ID}
            client-secret: ${CATALOG_CLIENT_SECRET}
            client-authentication-method: client_secret_basic
            authorization-grant-type: urn:ietf:params:oauth:grant-type:token-exchange
            scope: catalog.search,catalog.learning-resource.read
          membership-service:
            provider: institutional
            client-id: ${MEMBERSHIP_CLIENT_ID}
            client-secret: ${MEMBERSHIP_CLIENT_SECRET}
            client-authentication-method: client_secret_basic
            authorization-grant-type: urn:ietf:params:oauth:grant-type:token-exchange
            scope: membership.profile.read
          circulation-service:
            provider: institutional
            client-id: ${CIRCULATION_CLIENT_ID}
            client-secret: ${CIRCULATION_CLIENT_SECRET}
            client-authentication-method: client_secret_basic
            authorization-grant-type: urn:ietf:params:oauth:grant-type:token-exchange
            scope: circulation.eligibility.read,circulation.loan.read,circulation.loan.request,circulation.loan.cancel,circulation.loan.renew,circulation.reservation.read,circulation.reservation.place,circulation.reservation.cancel
          notification-service:
            provider: institutional
            client-id: ${NOTIFICATION_CLIENT_ID}
            client-secret: ${NOTIFICATION_CLIENT_SECRET}
            client-authentication-method: client_secret_basic
            authorization-grant-type: urn:ietf:params:oauth:grant-type:token-exchange
            scope: notification.inbox.read,notification.inbox.write,notification.preferences.read,notification.preferences.write
          digital-content-service:
            provider: institutional
            client-id: ${DIGITAL_CONTENT_CLIENT_ID}
            client-secret: ${DIGITAL_CONTENT_CLIENT_SECRET}
            client-authentication-method: client_secret_basic
            authorization-grant-type: urn:ietf:params:oauth:grant-type:token-exchange
            scope: digital-content.availability.read,digital-content.download.authorize
          institutional:
            provider: institutional
            client-id: ${OIDC_CLIENT_ID}
            client-secret: ${OIDC_CLIENT_SECRET}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: ${BFF_PUBLIC_BASE_URL:http://localhost:8080}/login/oauth2/code/{registrationId}
            scope: openid,profile,email

app:
  oauth-token-client:
    connect-timeout: ${OAUTH_TOKEN_CONNECT_TIMEOUT:PT2S}
    read-timeout: ${OAUTH_TOKEN_READ_TIMEOUT:PT5S}
    maximum-response-bytes: ${OAUTH_TOKEN_MAXIMUM_RESPONSE_BYTES:65536}
  bff:
    deployment-tier: ${DEPLOYMENT_TIER:local}
    public-base-url: ${BFF_PUBLIC_BASE_URL:http://localhost:8080}
    secure-cookies: ${BFF_SECURE_COOKIES:false}
    session-maximum-age: ${BFF_SESSION_MAXIMUM_AGE:PT8H}
  clients:
    catalog:
      base-url: ${CATALOG_SERVICE_URL:http://localhost:8082}
      audience: ${CATALOG_AUDIENCE:catalog-api}
      connect-timeout: ${CATALOG_CONNECT_TIMEOUT:PT1S}
      read-timeout: ${CATALOG_READ_TIMEOUT:PT3S}
      maximum-response-bytes: ${CATALOG_MAXIMUM_RESPONSE_BYTES:524288}
      maximum-delegated-token-lifetime: ${CATALOG_MAXIMUM_DELEGATED_TOKEN_LIFETIME:PT5M}
    membership:
      base-url: ${MEMBERSHIP_SERVICE_URL:http://localhost:8081}
      audience: ${MEMBERSHIP_AUDIENCE:membership-api}
      connect-timeout: ${MEMBERSHIP_CONNECT_TIMEOUT:PT1S}
      read-timeout: ${MEMBERSHIP_READ_TIMEOUT:PT3S}
      maximum-response-bytes: ${MEMBERSHIP_MAXIMUM_RESPONSE_BYTES:65536}
      maximum-delegated-token-lifetime: ${MEMBERSHIP_MAXIMUM_DELEGATED_TOKEN_LIFETIME:PT5M}
    circulation:
      base-url: ${CIRCULATION_SERVICE_URL:http://localhost:8083}
      audience: ${CIRCULATION_AUDIENCE:circulation-api}
      connect-timeout: ${CIRCULATION_CONNECT_TIMEOUT:PT1S}
      read-timeout: ${CIRCULATION_READ_TIMEOUT:PT5S}
      maximum-response-bytes: ${CIRCULATION_MAXIMUM_RESPONSE_BYTES:65536}
      maximum-delegated-token-lifetime: ${CIRCULATION_MAXIMUM_DELEGATED_TOKEN_LIFETIME:PT5M}
    notification:
      base-url: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
      audience: ${NOTIFICATION_AUDIENCE:notification-api}
      connect-timeout: ${NOTIFICATION_CONNECT_TIMEOUT:PT1S}
      read-timeout: ${NOTIFICATION_READ_TIMEOUT:PT5S}
      maximum-response-bytes: ${NOTIFICATION_MAXIMUM_RESPONSE_BYTES:262144}
      maximum-delegated-token-lifetime: ${NOTIFICATION_MAXIMUM_DELEGATED_TOKEN_LIFETIME:PT5M}
    digital-content:
      base-url: ${DIGITAL_CONTENT_SERVICE_URL:http://localhost:8085}
      audience: ${DIGITAL_CONTENT_AUDIENCE:digital-content-api}
      download-base-url: ${DOWNLOAD_CLOUDFRONT_BASE_URL:https://downloads.example.test}
      connect-timeout: ${DIGITAL_CONTENT_CONNECT_TIMEOUT:PT1S}
      read-timeout: ${DIGITAL_CONTENT_READ_TIMEOUT:PT5S}
      maximum-response-bytes: ${DIGITAL_CONTENT_MAXIMUM_RESPONSE_BYTES:65536}
      maximum-delegated-token-lifetime: ${DIGITAL_CONTENT_MAXIMUM_DELEGATED_TOKEN_LIFETIME:PT5M}
      maximum-signed-url-lifetime: ${DOWNLOAD_MAXIMUM_SIGNED_URL_LIFETIME:PT5M}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,redis
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
