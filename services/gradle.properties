org.gradle.caching=true
# The protobuf Gradle plugin still captures Project objects and cannot safely
# store Gradle 9 configuration-cache state. Re-enable after that plugin is compatible.
org.gradle.configuration-cache=false
org.gradle.parallel=true
org.gradle.warning.mode=all
kotlin.code.style=official
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m
